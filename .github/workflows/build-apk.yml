name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # All optional — what each one does is described in README.md.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Regenerate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.4 --distribution-type bin

      # Either commit app/google-services.json, or put its full text in the GOOGLE_SERVICES_JSON secret.
      - name: Write google-services.json from the secret
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Check the Firebase config
        run: |
          if [ -f app/google-services.json ]; then
            echo "app/google-services.json found - Firebase will be wired."
          else
            echo "::warning::app/google-services.json is missing. The APK still builds but opens in preview mode (no sign-in)."
          fi

      # A fixed signing key keeps the same signature on every build (update in place, no data wipe).
      - name: Restore the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      # Extra, never blocking: the same app built the way it will really run (R8-optimized, release
      # mode). Install THIS one to judge cold-start speed — the debug APK is far slower to open.
      - name: Build optimized APK (for startup measurements)
        id: optimized
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee optimized-output.log
        continue-on-error: true

      - name: Upload optimized APK
        if: steps.optimized.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cady-marketing-optimized-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload optimized build log (if it failed)
        if: steps.optimized.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: optimized-build-log
          path: optimized-output.log

      # The errors, right on the run's summary page — no need to open the raw log to find them.
      - name: Show build errors in the run summary
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Unresolved reference' -A2 build-output.log | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure logs
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ci-failure-logs
          cp build-output.log ci-failure-logs/ 2>/dev/null || true
          grep -E '^e: |error:|What went wrong|Execution failed' -A2 build-output.log > ci-failure-logs/errors-only.txt 2>/dev/null || true
          if [ -d app/build/reports ]; then cp -r app/build/reports ci-failure-logs/app-build-reports; fi

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: ci-failure-logs/

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cady-marketing-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
